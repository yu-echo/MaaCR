name: install

env:
  # 版本控制：
  #   MAAFW_VERSION / MFAA_VERSION 留空 = 用对方的 latest release
  #   填具体版本号（如 v5.13.1 / v2.16.1）= 锁死那一版
  # 为什么要留这个口子：MaaFramework 与 MFAAvalonia 发新版的速度不慢，
  # 万一上游改坏了什么，填上版本号就能先发出一个可用的包。
  MAAFW_VERSION: ""
  MFAA_VERSION: ""

on:
  # 打 v* 标签就出正式发布；分支上跑（workflow_dispatch）只出 -ci. 预览包，不发 Release。
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        shell: bash
        run: |
          # 标签就是 v* 形式 -> 正式发布，直接用这个标签
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            # 不是正式发布：拿「上一个正式版 + 日期 + 短 sha」拼一个可读的预览版号
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi

          # 预览包在版本号里插一个 -ci.，让人一眼看出不是正式版
          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi

          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
            echo "这是预发布版本"
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT

  install:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # MaaFramework 的原生库。解压后是 deps/bin、deps/share 这个结构，
      # tools/install.py 会把它摆成 MFAAvalonia 认得的 runtimes/<rid>/native 布局。
      - name: 下载 MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-win-x86_64*"
          latest: ${{ env.MAAFW_VERSION == '' }}
          tag: ${{ env.MAAFW_VERSION }}
          out-file-path: "deps"
          extract: true

      # 图形界面本体。先解到 MFA/，稍后平铺进 install/
      - name: 下载 MFAAvalonia
        id: download_mfa
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MFAAvalonia
          fileName: "MFAAvalonia-*-win-x64*"
          latest: ${{ env.MFAA_VERSION == '' }}
          tag: ${{ env.MFAA_VERSION }}
          out-file-path: "MFA"
          extract: true

      - name: 删掉下载下来的压缩包
        shell: bash
        run: rm -f "${{ fromJson(steps.download_mfa.outputs.downloaded_files)[0] }}"

      # MFAAvalonia 自带的那份 MaaFramework 原生库是给裸跑的，我们要换成 deps/ 里的
      - name: 去掉 MFAAvalonia 自带的运行时
        shell: bash
        run: rm -rf MFA/runtimes

      - name: 把 MFAAvalonia 平铺到 install/
        shell: bash
        run: |
          mkdir -p install
          cp -r MFA/. install/
          ls install/ | head -20

      # 自带 Python：用户就不用自己装 Python 和依赖了
      - name: 安装自带 Python
        run: python tools/ci/setup_embed_python.py install

      # 组装：复制资源 / agent / tools，并改写 interface.json 里的路径
      - name: 组装发布包
        run: python tools/install.py ${{ needs.meta.outputs.tag }}

      - name: 出包后的自检
        run: python tools/validate.py

      - uses: actions/upload-artifact@v4
        with:
          name: MaaCR-win-x86_64
          path: "install"
          # ★ 必须开：默认不传隐藏文件，而 resource/base/ 里只有一个 .gitkeep ——
          #   一旦它被丢掉，空目录也不会被存进产物，解压出来就没有 resource/base/，
          #   pretask 的工作目录不存在，环境准备直接报「目录名无效」。
          include-hidden-files: true

  changelog:
    name: 生成更新日志
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 用 git-cliff 生成更新日志
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          # 正式版：只看正式标签，把上一个正式版以来的提交都算进来
          # 预览版：照常，只算上一个标签以来的
          args: >-
            -vv --latest --strip header
            ${{ needs.meta.outputs.is_prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  release:
    # 只有正式发布（打 v* 标签）才建 Release；分支上跑只留构建产物
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, install, changelog]
    runs-on: ubuntu-latest
    # ★ 必须显式声明。仓库默认的 GITHUB_TOKEN 是只读的，不加这一行
    #   softprops/action-gh-release 会直接 403：Resource not accessible by integration。
    #   只给 release 这一步，别图省事写在顶层把写权限摊给所有作业。
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: 打包成 zip
        run: |
          cd assets
          for f in *; do
            (cd "$f" && zip -r -q "../$f-${{ needs.meta.outputs.tag }}.zip" .)
          done
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*.zip
          tag_name: ${{ needs.meta.outputs.tag }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
