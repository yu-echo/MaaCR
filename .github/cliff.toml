# git-cliff 配置：把提交记录按「约定式提交」的前缀分好组，生成给人看的更新日志。
# 发布工作流用它生成 Release 的正文（见 .github/workflows/install.yml 的 changelog 任务）。
#
# 想让自己写的 commit 出现在对应的分组里，就用对应的前缀：
#   feat: / fix: / perf: / refactor: / docs: / chore: ...
# 不想让它进更新日志：提交信息里带上 [skip changelog]

[remote.github]
owner = "yu-echo"
repo = "MaaCR"

[changelog]
header = """
# 更新日志
"""

body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | split(pat="\n") | first | upper_first }} \
        {% if commit.github.username %} @{{ commit.github.username }}{% else %} {{ commit.author.name }}{% endif %}
        {%- if commit.footers -%}
            {%- for footer in commit.footers -%}
                {%- if footer.token == "Co-authored-by" -%}
                    {%- set co_author_name = footer.value | split(pat=" <") | first | trim %} @{{ co_author_name }}
                {%- endif -%}
            {%- endfor -%}
        {%- endif %}
{% endmacro -%}

{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
    ## 未发布
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor %}
    {% for commit in commits %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor -%}
"""

# 尾部：Release 正文里最有用的其实是这几行「怎么装怎么跑」。
# （工作流只 --strip header，不会把 footer 也剥掉。）
footer = """
---

## 下载与使用

- 下载 `MaaCR-win-x86_64-<版本>.zip`，**解压到纯英文路径**下再跑（中文路径容易出各种怪问题）。
- 双击 `MFAAvalonia.exe`。若提示缺少 .NET，先双击 `install-deps-win.bat`，装完**重启电脑**再试。
- 首次使用前请看 [使用前准备](https://github.com/yu-echo/MaaCR#使用前准备)：需要 MuMu 模拟器
  （720×1280 竖屏、已装国服皇室战争、已手动登录过一次、开好 USB 调试）。
- 第一次跑强烈建议先勾上「演练模式」——只识别、不点击，确认它认得准再放它动手。

> 这是绿色包，不是安装程序：不写注册表、不装服务，删掉文件夹就等于卸载。
"""

[git]
conventional_commits = true      # 按约定式提交解析
filter_unconventional = false    # 但按普通提交写的也别丢
split_commits = false
protect_breaking_commits = false
commit_parsers = [
    { message = ".*\\[skip changelog\\].*", skip = true },
    { body = ".*\\[skip changelog\\].*", skip = true },
    { message = "^feat", group = "<!-- 0 -->✨ 新功能" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug 修复" },
    { message = "^perf", group = "<!-- 2 -->🚀 性能优化" },
    { message = "^refactor", group = "<!-- 3 -->🚜 代码重构" },
    { message = "^docs", group = "<!-- 4 -->📚 文档" },
    { message = "^style", group = "<!-- 5 -->🎨 样式" },
    { message = "^test", group = "<!-- 6 -->🧪 测试" },
    { message = "^ci", group = "<!-- 7 -->⚙️ 持续集成" },
    { message = "^chore\\(deps\\)", group = "📦 依赖更新" },
    { message = "^chore", group = "<!-- 8 -->🔧 日常维护" },
    { body = ".*security", group = "<!-- 9 -->🔒 安全" },
    { message = "^revert", group = "<!-- 10 -->◀️ 撤销" },
]

ignore_tags = "rc"          # rc 标签不进日志
sort_commits = "oldest"

[git.github]
commits = true              # 带上 @用户名，并识别首次贡献者
