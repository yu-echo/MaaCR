name: check

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "agent/**"
      - "tools/**"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "agent/**"
      - "tools/**"
  workflow_dispatch:

jobs:
  resource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 只做语法检查，不装任何依赖 —— 这一层永远不会因为网络问题红掉
      - name: Python 语法检查
        run: python -m compileall -q agent tools

      # 抓「不会报错、只会静默失效」的那几类问题：
      # 模板路径写错、next 指向不存在的节点、Custom 名没注册、
      # interface.json 的 entry 拼错、pretask 路径不符合 MFAAvalonia 的解析约定……
      - name: 项目自检
        run: python tools/validate.py
