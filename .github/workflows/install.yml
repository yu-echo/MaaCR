name: install

# 触发与产出：
#   · 推 `v*` tag     → 正式发版（prerelease=false），资产挂到该 tag 的 Release
#   · 推任意分支       → CI 预发布（tag 自动带 `-ci.` 后缀，prerelease=true）
#   · PR / 手动触发    → 只构建，不发版（制品可在 Actions 页面下载来验证）
#
# 产出两种形态（架构只有 x86_64：本项目依赖 MuMu 模拟器，它只有 x86_64 Windows 版）：
#   MaaCR-win-x86_64-<tag>-MFAA.zip    图形界面版，解压双击即用
#   MaaCR-win-x86_64-<tag>-PiCLI.zip   纯命令行版
on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "docs/**"
      - "tools/ci/**"
      - "README.md"
      - "使用说明.md"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "docs/**"
      - "tools/ci/**"
  workflow_dispatch:

env:
  # ⚠️ 改这两个版本号前，先确认上游 release 的资产名仍然匹配
  #    （MaaFramework: MAA-win-x86_64* / MFAAvalonia: MFAAvalonia-*-win-x64*）
  MaaFw_version: v5.14.2
  MFAA_version: v2.16.2
  app_name: MaaCR

jobs:
  meta:
    name: 计算版本号
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set_tag
        name: 推导 tag
        run: |
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            # 不是 tag 推送：拿最近一个正式版的号当基版本
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
                  --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' \
                  | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi

          # 非 tag 推送 → 标成 CI 预发布
          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi

          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT

  build:
    name: 构建 win-x86_64
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载 MaaFramework（取 MaaPiCli 当命令行版外壳）
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-win-x86_64*"
          tag: ${{ env.MaaFw_version }}
          out-file-path: deps
          extract: true

      - name: 下载 MFAAvalonia（图形界面版外壳）
        uses: robinraju/release-downloader@v1
        with:
          repository: SweetSmellFox/MFAAvalonia
          fileName: "MFAAvalonia-*-win-x64*"
          tag: ${{ env.MFAA_version }}
          out-file-path: MFA
          extract: true

      - name: 组装两种形态（含自检 + 打 zip）
        shell: bash
        run: |
          python tools/ci/install.py \
            --version "${{ needs.meta.outputs.tag }}" \
            --mfaa ./MFA \
            --maa  ./deps \
            --out  ./install

      - name: 列出产物
        shell: bash
        run: ls -la ./install

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: install/*.zip
          if-no-files-found: error

  changelog:
    name: 生成更新日志
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: git-cliff
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          args: >-
            -vv --latest --strip header
            ${{ needs.meta.outputs.is_prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  release:
    name: 发布
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, build, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: 列出待发布文件
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
